<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒体艺术展览工作台 API 文档</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.10.5/swagger-ui.css">
    <style>
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }

        *, *:before, *:after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        #swagger-ui {
            max-width: 1460px;
            margin: 0 auto;
        }

        /* 自定义顶部信息栏 */
        .topbar {
            background-color: #1b1b1b;
            padding: 10px 0;
        }

        .topbar-wrapper {
            max-width: 1460px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .topbar-wrapper .link {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .topbar-wrapper .link img {
            height: 40px;
            margin-right: 10px;
        }

        .topbar-wrapper .link span {
            color: #fff;
            font-size: 1.5em;
            font-weight: bold;
        }

        /* 自定义配色 */
        .swagger-ui .topbar {
            background-color: #2c3e50;
        }

        .swagger-ui .information-container .info .title {
            color: #2c3e50;
        }

        .swagger-ui .information-container .info .base-url {
            color: #7f8c8d;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .swagger-ui .wrapper {
                padding: 0 10px;
            }
        }

        /* 加载动画 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 1.2em;
            color: #666;
        }

        .loading::after {
            content: '';
            width: 30px;
            height: 30px;
            margin-left: 10px;
            border: 3px solid #ddd;
            border-top-color: #2c3e50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="swagger-ui">
        <div class="loading">正在加载 API 文档...</div>
    </div>

    <script src="https://unpkg.com/swagger-ui-dist@5.10.5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.10.5/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            // 初始化 Swagger UI
            const ui = SwaggerUIBundle({
                // OpenAPI 规范文件路径
                url: "/api/swagger.yaml",

                // DOM 元素
                dom_id: '#swagger-ui',

                // 深度链接
                deepLinking: true,

                // 显示操作 ID
                displayOperationId: false,

                // 显示请求持续时间
                displayRequestDuration: true,

                // 操作排序
                operationsSorter: function(a, b) {
                    // 按照方法排序：GET, POST, PUT, DELETE
                    const methodsOrder = ['get', 'post', 'put', 'patch', 'delete'];
                    const result = methodsOrder.indexOf(a.get('method')) - methodsOrder.indexOf(b.get('method'));
                    if (result !== 0) return result;
                    return a.get('path').localeCompare(b.get('path'));
                },

                // 标签排序
                tagsSorter: function(a, b) {
                    // 按照定义顺序排序
                    const tagsOrder = ['认证', '数据管理', '文件管理', '归档管理', '配置管理', '系统清理'];
                    return tagsOrder.indexOf(a) - tagsOrder.indexOf(b);
                },

                // 默认模型展开深度
                defaultModelsExpandDepth: 1,

                // 默认模型展开深度
                defaultModelExpandDepth: 1,

                // 显示扩展名
                displayOperationId: false,

                // 过滤
                filter: true,

                // 预设
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],

                // 插件
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],

                // 布局
                layout: "StandaloneLayout",

                // 验证
                validatorUrl: null,

                // 请求拦截器
                requestInterceptor: function(request) {
                    // 可以在这里添加全局请求处理
                    console.log('Request:', request);
                    return request;
                },

                // 响应拦截器
                responseInterceptor: function(response) {
                    // 可以在这里添加全局响应处理
                    console.log('Response:', response);
                    return response;
                }
            });

            // 将 ui 暴露到全局，方便调试
            window.ui = ui;

            // 添加自定义按钮
            setTimeout(function() {
                // 添加"返回首页"按钮
                const topbar = document.querySelector('.topbar-wrapper');
                if (topbar) {
                    const homeLink = document.createElement('a');
                    homeLink.href = '/';
                    homeLink.className = 'link';
                    homeLink.style.cssText = 'display: inline-flex; align-items: center; padding: 5px 15px; background: #3498db; color: white; text-decoration: none; border-radius: 3px; margin-left: auto; font-size: 14px;';
                    homeLink.innerHTML = '<span>返回首页</span>';
                    topbar.appendChild(homeLink);
                }
            }, 1000);
        };
    </script>
</body>
</html>
